<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/favicon.png" type="image/png">

<title>Workout Tracker</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    max-width:600px;
    margin:auto;
    padding:12px;
    background:#f4f4f4;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.schedule-link{
    text-align:center;
    margin-top:-12px;
    margin-bottom:20px;
}

.schedule-link a{
    color:#0066cc;
    text-decoration:none;
    font-size:16px;
}

.schedule-link a:hover{
    text-decoration:underline;
}
    
label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:5px;
}

.set-label{
    margin-top:4px;
    margin-bottom:4px;
}
    
select,
input{
    width:100%;
    padding:6px 10px;
    font-size:16px;
}

.form-row{
    display:flex;
    gap:12px;
}

.form-row > div{
    flex:1;
}

.exercise-card{

    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:8px;
    border:1px solid #ccc;

}

.exercise-title{

    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;

}

.info-row{

    display:flex;
    justify-content:space-between;
    background:#eee;
    padding:8px;
    border-radius:5px;
    margin-bottom:10px;

}

.set-row{

    display:flex;
    gap:10px;
    margin-top:8px;

}

.set-row div{

    flex:1;
    text-align:center;

}

.set-row input{

    text-align:center;

}

button{

    padding:8px 14px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;

}

.rest-btn{
    width:100%;
    background:#2196F3;
    color:white;
}
    
.save-btn{

    width:100%;
    margin-top:15px;
    background:#4CAF50;
    color:white;

}

.button-row{

    display:flex;
    gap:10px;
    margin-top:15px;

}

.reset-btn{

    flex:1;
    background:#757575;
    color:white;

}

.save-btn{

    flex:1;
    margin-top:0;
    background:#4CAF50;
    color:white;

}
    
.github-btn{

    width:100%;
    margin-top:20px;
    background:#FF9800;
    color:white;

}

.remember-token-label{

    display:flex;
    align-items:center;
    gap:8px;
    font-weight:normal;
    margin-top:8px;
    margin-bottom:0;

}

.remember-token-label input{

    width:auto;
    margin:0;

}
    
.completed{

    margin-top:20px;
    background:white;
    padding:12px;
    border-radius:8px;

}

.completed-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.completed-item span{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
}    
    
.delete-btn{
    background:none;
    border:none;
    color:#d32f2f;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    padding:6px 10px;
    line-height:1;
}

.delete-btn:hover{
    color:#b71c1c;
}

.heading{

    font-weight:bold;
    background:#333;
    color:white;
    padding:8px;
    text-align:center;

}

input::placeholder{

    color:#999;
    opacity:1;

}
    
</style>

</head>


<body>


<h1>
Workout Tracker
</h1>

<div class="schedule-link">
    <a
        href="https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/gh-pages/img/Sample_Schedule.jpg"
        target="_blank"
        rel="noopener noreferrer">
        (Schedule)
    </a>
</div>


<label for="category">
Category
</label>

<select id="category">
</select>



<label for="exercise">
Exercise
</label>

<select id="exercise">
</select>



<div class="exercise-card">


<div class="exercise-title" id="exerciseTitle">
Select an exercise
</div>


<div class="info-row">

<div>
Weight
<br>
<span id="weightDisplay">
-
</span>
</div>

<div>
Last Workout
<br>
<span id="previousDateDisplay">-</span>
</div>

<div>
Goal Reps/Sets
<br>
<span id="goalDisplay">
-
</span>
</div>

</div>

<div style="margin:12px 0;">

    <button
        id="restButton"
        class="rest-btn"
        onclick="startRestTimer()">
        Start 2:00 Rest Interval
    </button>

</div>

<div class="set-row">

<div>

<label class="set-label">
    Set 1
</label>

<input
type="number"
id="set1"
placeholder="0"
>

</div>


<div>

<label class="set-label">
    Set 2
</label>

<input
type="number"
id="set2"
placeholder="0"
>

</div>


<div>

<label class="set-label">
    Set 3
</label>

<input
type="number"
id="set3"
placeholder="0"
>

</div>


</div>



<div class="button-row">

    <button
        class="reset-btn"
        onclick="resetForm()">
        Reset
    </button>

    <button
        class="save-btn"
        onclick="saveExercise()">
        Save
    </button>

</div>


</div>



<div class="completed">


<div class="heading">

Completed Today

</div>


<div id="completedList">

No exercises completed.

</div>


</div>




<label for="githubToken">

GitHub Token

</label>


<input

type="password"

id="githubToken"

autocomplete="off"

placeholder="Paste Token to Save"

>

<label class="remember-token-label">

<input
type="checkbox"
id="rememberToken"
>

<span>Remember Token</span>

</label>



<button

class="github-btn"

onclick="saveDay()"

>

Save Workout Log

</button>



<script>
    
/*
====================================================
CONFIGURATION
====================================================
*/

const LOG_URL =
"https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/log/workout-log.csv";

const WORKOUT_URL =

"https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/data/workout.csv";


const GITHUB_OWNER =

"bcdatavis";


const GITHUB_REPO =

"fitness-tracker";


const GITHUB_BRANCH =

"main";


const LOG_FILE =

"log/workout-log.csv";



/*
====================================================
GLOBALS
====================================================
*/

let previousWorkout = {};

let exercises = [];


let currentExercise = null;


let completed = [];




async function loadWorkoutLog(){

    try{

        const response = await fetch(LOG_URL);

        if(!response.ok){
            throw new Error("Unable to load workout log");
        }

        const csv = await response.text();

        const rows = csv.trim().split("\n");
        rows.shift();   // Remove header row

        rows.forEach(row=>{

            if(!row.trim()){
                return;
            }

            const cols = parseCSVLine(row);

            if(cols.length < 7){
                return;
            }
            
            const exercise = cols[2];
            
            previousWorkout[exercise] = {

                date: cols[0].replace(/^"|"$/g, ""),
                set1: cols[4],
                set2: cols[5],
                set3: cols[6]
            
            };

        });

    }
    catch(error){

        console.error(error);

    }

console.log("Previous workouts:", previousWorkout);
}

/*
====================================================
PARSE A SINGLE CSV LINE
Handles commas inside quoted fields.
====================================================
*/

function parseCSVLine(line){

    const result = [];

    let current = "";

    let inQuotes = false;

    for(let i=0;i<line.length;i++){

        const c = line[i];

        if(c === '"'){

            inQuotes = !inQuotes;

        }

        else if(c === "," && !inQuotes){

            result.push(current);

            current = "";

        }

        else{

            current += c;

        }

    }

    result.push(current);

    return result.map(x=>x.trim());

}
    
/*
====================================================
LOAD WORKOUT CSV
====================================================
*/


async function loadWorkout(){


try{


const response =
await fetch(WORKOUT_URL);

if(!response.ok){

    throw new Error(
        "CSV loading failed: " + response.status
    );

}

const csv =
await response.text();

console.log(csv);



const rows =
csv.split("\n");



rows.shift();



rows.forEach(row=>{


if(!row.trim()){
    return;
}
    
const cols =
row.split(",").map(x => x.trim());


const item = {

    category:
    cols[0]?.trim() || "",

    exercise:
    cols[1]?.trim() || "",

    weight:
    cols[2]?.trim() || "",

    set1:
    cols[3]?.trim() || "",

    set2:
    cols[4]?.trim() || "",

    set3:
    cols[5]?.trim() || ""

};



exercises.push(item);



});



populateCategories();



}

catch(error){


console.error(error);


alert(
"Unable to load workout.csv"
);


}


}




/*
====================================================
LOAD CATEGORIES
====================================================
*/


function populateCategories(){


const categorySelect =

document.getElementById("category");



const placeholder =

document.createElement("option");


placeholder.value = "";

placeholder.textContent =

"Select one";


placeholder.disabled = true;

placeholder.selected = true;


categorySelect.appendChild(placeholder);



const categories =

[...new Set(

exercises.map(x=>x.category)

)];



categories.forEach(category=>{


const option =

document.createElement("option");


option.value = category;


option.textContent = category;


categorySelect.appendChild(option);


});


}



function populateExercises(){


const category =

document.getElementById("category").value;



const exerciseSelect =

document.getElementById("exercise");



exerciseSelect.innerHTML = "";



const placeholder =

document.createElement("option");


placeholder.value = "";

placeholder.textContent =

"Select one";


placeholder.disabled = true;


placeholder.selected = true;


exerciseSelect.appendChild(placeholder);



exercises

.filter(x=>x.category===category)

.forEach(item=>{


const option =

document.createElement("option");


option.value = item.exercise;


option.textContent = item.exercise;


exerciseSelect.appendChild(option);


});


}


function formatPreviousWorkout(dateString){

    if(!dateString){
        return "-";
    }

    // Remove weekday if present
    // Example:
    // "Tuesday, July 21, 2026"
    // becomes
    // "July 21, 2026"

    const cleaned =
        dateString.replace(/^[^,]+,\s*/, "");

    const previousDate =
        new Date(cleaned);

    if(isNaN(previousDate)){
        return dateString;
    }

    const today = new Date();

    const diffDays =
        Math.floor(
            (today - previousDate) /
            (1000 * 60 * 60 * 24)
        );

    const shortDate =
        previousDate.toLocaleDateString(
            "en-US",
            {
                month:"short",
                day:"numeric"
            }
        );

    if(diffDays === 0){
        return `Today (${shortDate})`;
    }

    if(diffDays === 1){
        return `1 day ago (${shortDate})`;
    }

    return `${diffDays} days ago (${shortDate})`;

}    
    

function displayExercise(){

    const name =
        document.getElementById("exercise").value;

    currentExercise =
        exercises.find(
            x => x.exercise === name
        );

    if(!currentExercise){
        return;
    }

    // Get the previous workout for this exercise
    const previous =
        previousWorkout[currentExercise.exercise];

    document.getElementById("exerciseTitle").textContent =
        currentExercise.exercise;

    document.getElementById("weightDisplay").textContent =
        currentExercise.weight;

    document.getElementById("previousDateDisplay").textContent =
        formatPreviousWorkout(previous?.date);

    document.getElementById("goalDisplay").textContent =
        `${currentExercise.set1 || "-"} / ${currentExercise.set2 || "-"} / ${currentExercise.set3 || "-"}`;

    // Always start with empty inputs
    document.getElementById("set1").value = "";
    document.getElementById("set2").value = "";
    document.getElementById("set3").value = "";

    // Show previous workout as grey placeholder text
    document.getElementById("set1").placeholder =
        previous?.set1 || "0";

    document.getElementById("set2").placeholder =
        previous?.set2 || "0";

    document.getElementById("set3").placeholder =
        previous?.set3 || "0";

}


/*
====================================================
REST TIMER
====================================================
*/

let restCountdown = null;
    
function startRestTimer(){

    // Ignore clicks while timer is running
    if(restCountdown){
        return;
    }

    let seconds = 120;

    const button =
        document.getElementById("restButton");

    button.disabled = true;

    updateButton();

    restCountdown = setInterval(function(){

        seconds--;

        updateButton();

        if(seconds <= 0){

            clearInterval(restCountdown);
            restCountdown = null;

            button.textContent = "✔ Rest Complete!";

            button.disabled = false;

            // Optional beep
            try{
                new Audio(
                    "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
                ).play();
            }
            catch(e){}

            // Return to original text after 3 seconds
            setTimeout(function(){

                button.textContent =
                    "Start 2:00 Rest Interval";

            },3000);

        }

    },1000);
    
    function updateButton(){

        const mins =
            Math.floor(seconds/60);

        const secs =
            String(seconds%60).padStart(2,"0");

        button.textContent =
            `Rest: ${mins}:${secs}`;

    }

}

function resetForm(){

    // Stop rest timer if running
    if(restCountdown){

        clearInterval(restCountdown);
        restCountdown = null;

    }

    const restButton =
        document.getElementById("restButton");

    restButton.disabled = false;
    restButton.textContent =
        "Start 2:00 Rest Interval";

    // Reset dropdowns
    document.getElementById("category").selectedIndex = 0;

    const exercise =
        document.getElementById("exercise");

    exercise.innerHTML =
        '<option value="" disabled selected>Select one</option>';

    currentExercise = null;

    // Reset displays
    document.getElementById("exerciseTitle").textContent =
        "Select an exercise";

    document.getElementById("weightDisplay").textContent =
        "-";

    document.getElementById("previousDateDisplay").textContent = "-";

    document.getElementById("goalDisplay").textContent =
        "-";

    // Clear set inputs
    document.getElementById("set1").value = "";
    document.getElementById("set2").value = "";
    document.getElementById("set3").value = "";

    completed = [];

    updateCompleted();

    localStorage.removeItem("workoutTracker");

    document.getElementById("githubToken").value = "";

}

/*
====================================================
SAVE CURRENT EXERCISE
====================================================
*/


function saveExercise(){


if(!currentExercise){

alert(
"Select an exercise first."
);

return;

}


const entry = {


date:getToday(),


category:currentExercise.category,


exercise:currentExercise.exercise,


weight:currentExercise.weight,


set1:
document.getElementById("set1").value,


set2:
document.getElementById("set2").value,


set3:
document.getElementById("set3").value


};


completed.push(entry);


updateCompleted();


saveLocalState();



document.getElementById("set1").value="";

document.getElementById("set2").value="";

document.getElementById("set3").value="";

}
 
/*
====================================================
UPDATE COMPLETED LIST
====================================================
*/
function updateCompleted(){

    const list =
        document.getElementById("completedList");

    if(completed.length===0){

        list.textContent =
            "No exercises completed.";

        return;

    }

    list.innerHTML = "";

    completed.forEach((item,index)=>{

        const div =
            document.createElement("div");

        div.className =
            "completed-item";

        const text =
            document.createElement("span");

        text.textContent =
            `✓ ${item.exercise} (${item.set1 || 0}/${item.set2 || 0}/${item.set3 || 0})`;

        const remove =
            document.createElement("button");

        remove.className =
            "delete-btn";

        remove.textContent = "✕";

        remove.onclick = function(){

            completed.splice(index,1);

            saveLocalState();
            
            updateCompleted();

        };

        div.appendChild(text);

        div.appendChild(remove);

        list.appendChild(div);

    });

}




function loadGitHubToken(){

    const savedToken =
        localStorage.getItem("githubToken");

    const remember =
        localStorage.getItem("rememberToken");


    if(savedToken && remember === "true"){

        document.getElementById("githubToken").value =
            savedToken;

        document.getElementById("rememberToken").checked =
            true;

    }

}
    

/*
====================================================
DATE FORMAT
====================================================
*/


function getToday(){


return new Intl.DateTimeFormat(

"en-CA",

{

timeZone:"America/Vancouver",

weekday:"long",

year:"numeric",

month:"long",

day:"numeric"

}

).format(new Date());


}






/*
====================================================
LOCAL STORAGE
====================================================
*/


function saveLocalState(){


const state = {


completed:completed,


};



localStorage.setItem(

"workoutTracker",

JSON.stringify(state)

);


}





function loadLocalState(){


const saved =

localStorage.getItem(

"workoutTracker"

);



if(!saved){

return;

}



const state =

JSON.parse(saved);



completed =

state.completed || [];


updateCompleted();



}





/*
====================================================
SAVE WORKOUT LOG TO GITHUB
====================================================
*/


async function saveDay(){


const token =

document.getElementById(

"githubToken"

).value.trim();

if(
document.getElementById("rememberToken").checked
){

    localStorage.setItem(
        "githubToken",
        token
    );

    localStorage.setItem(
        "rememberToken",
        "true"
    );

}

if(!token){


alert(

"Enter a GitHub PAT before saving."

);


return;


}



if(completed.length===0){


alert(

"No exercises completed."

);


return;


}




try{


const getResponse =

await fetch(

`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${LOG_FILE}`,

{

headers:{

Authorization:

`Bearer ${token}`,

Accept:

"application/vnd.github+json"

}

}

);



if(!getResponse.ok){


throw new Error(

"Unable to read workout-log.csv"

);


}




const existingFile =

await getResponse.json();



const currentContent =

atob(

existingFile.content.replace(/\n/g,"")

);




let newLines = "";



completed.forEach(item=>{


newLines +=
`"${item.date}",${item.category},${item.exercise},${item.weight},${item.set1},${item.set2},${item.set3}\n`;


});




const updatedContent =

currentContent + newLines;



const encodedContent =

btoa(

unescape(

encodeURIComponent(

updatedContent

)

)

);





const putResponse =

await fetch(

`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${LOG_FILE}`,

{

method:"PUT",


headers:{

Authorization:

`Bearer ${token}`,

Accept:

"application/vnd.github+json",

"Content-Type":

"application/json"

},



body:JSON.stringify({


message:

`Workout Log ${getToday()}`,


content:

encodedContent,


sha:

existingFile.sha,


branch:

GITHUB_BRANCH



})


}

);





if(!putResponse.ok){


const error =

await putResponse.json();



throw new Error(

error.message ||

"GitHub save failed"

);


}




alert(

"Workout log saved successfully."

);



clearWorkout();



}

catch(error){


console.error(error);



alert(

"Error saving workout log:\n\n" +

error.message

);


}



}





/*
====================================================
CLEAR AFTER SAVE
====================================================
*/


function clearWorkout(){


completed = [];


updateCompleted();



if(!document.getElementById("rememberToken").checked){

    document.getElementById("githubToken").value="";

}



localStorage.removeItem(

"workoutTracker"

);



}





/*
====================================================
EVENT LISTENERS
====================================================
*/


document

.getElementById("category")

.addEventListener(

"change",

function(){


populateExercises();


}

);





document

.getElementById("exercise")

.addEventListener(

"change",

function(){


displayExercise();


}

);


document
.getElementById("rememberToken")
.addEventListener("change", function(){

    if(this.checked){

        const token =
            document.getElementById("githubToken").value.trim();

        if(token){

            localStorage.setItem(
                "githubToken",
                token
            );

        }

        localStorage.setItem(
            "rememberToken",
            "true"
        );

    }
    else{

        localStorage.removeItem(
            "githubToken"
        );

        localStorage.removeItem(
            "rememberToken"
        );

    }

});




/*
====================================================
INITIALIZE
====================================================
*/


(async function(){

    await Promise.all([
        loadWorkout(),
        loadWorkoutLog()
    ]);

    loadLocalState();

    loadGitHubToken();

})();



</script>


</body>


</html>
