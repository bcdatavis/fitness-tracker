<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/favicon.png" type="image/png">

<title>Body Weight Tracker</title>

<!-- Include Chart.js for graphing -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Include PapaParse for CSV parsing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    max-width:600px;
    margin:auto;
    padding:12px;
    background:#f4f4f4;
}

h1{
    text-align:center;
    margin-bottom:20px;
}
    
label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:5px;
}
    
input{
    width:100%;
    padding:6px 10px;
    font-size:16px;
}

.exercise-card{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.save-btn{
    width:100%;
    margin-top:15px;
    background:#4CAF50;
    color:white;
}
    
.github-btn{
    width:100%;
    margin-top:20px;
    background:#FF9800;
    color:white;
}

.remember-token-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:normal;
    margin-top:8px;
    margin-bottom:0;
}

.remember-token-label input{
    width:auto;
    margin:0;
}

.chart-container{
    position: relative;
    height: 350px;
    width: 100%;
    margin-top: 25px;
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

input::placeholder{
    color:#999;
    opacity:1;
}

</style>

</head>


<body>

<h1>
Body Weight Tracker
</h1>

<div class="exercise-card">

    <label for="weightInput">
    Today's Weight (lbs)
    </label>

    <input
    type="number"
    id="weightInput"
    step="0.1"
    placeholder="e.g., 152.5"
    >

    <button
    class="save-btn"
    onclick="saveWeightEntry()">
    Save Weight
    </button>

</div>

<div class="chart-container">
    <canvas id="weightChart"></canvas>
</div>

<label for="githubToken">
GitHub Token
</label>

<input
type="password"
id="githubToken"
autocomplete="off"
placeholder="Paste Token to Save"
>

<label class="remember-token-label">
<input
type="checkbox"
id="rememberToken"
>
<span>Remember Token</span>
</label>

<button
class="github-btn"
onclick="saveWeightLog()"
>
Save Weight Log to GitHub
</button>



<script>
    
/*
====================================================
CONFIGURATION
====================================================
*/

const WEIGHT_LOG_URL =
"https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/log/weight-log.csv";

const GITHUB_OWNER =
"bcdatavis";

const GITHUB_REPO =
"fitness-tracker";

const GITHUB_BRANCH =
"main";

const WEIGHT_LOG_FILE =
"log/weight-log.csv";

/*
====================================================
GLOBALS
====================================================
*/

let weightHistory = [];
let weightChartInstance = null;

async function loadWeightLog(){
    try{
        const response = await fetch(WEIGHT_LOG_URL);
        if(!response.ok){
            throw new Error("Unable to load weight log");
        }

        const csvText = await response.text();
        const parsedData = Papa.parse(csvText, { header: true }).data;

        weightHistory = [];
        parsedData.forEach(row => {
            // Check if both Date and Weight exist and are valid
            if(row.Date && row.Weight && !isNaN(row.Weight)){
                weightHistory.push({
                    date: row.Date.replace(/^"|"$/g, "").trim(),
                    weight: parseFloat(row.Weight)
                });
            }
        });

        renderChart();
    }
    catch(error){
        console.error("Error loading weight log:", error);
    }
}

/*
====================================================
CHART RENDERING WITH LIMIT LINES
====================================================
*/

function renderChart(){
    const ctx = document.getElementById('weightChart').getContext('2d');
    
    if(weightChartInstance){
        weightChartInstance.destroy();
    }

    const labels = weightHistory.map(item => item.date);
    const dataPoints = weightHistory.map(item => item.weight);

    // Custom plugin to draw horizontal limit lines
    const limitLinesPlugin = {
        id: 'limitLines',
        afterDraw(chart) {
            const { ctx, chartArea: { left, right }, scales: { y } } = chart;
            
            // Bottom line at 150 lbs (Red)
            const y150 = y.getPixelForValue(150);
            ctx.save();
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(left, y150);
            ctx.lineTo(right, y150);
            ctx.stroke();
            ctx.restore();

            // Top line at 155 lbs (Green)
            const y155 = y.getPixelForValue(155);
            ctx.save();
            ctx.strokeStyle = 'green';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(left, y155);
            ctx.lineTo(right, y155);
            ctx.stroke();
            ctx.restore();
        }
    };

    weightChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Body Weight (lbs)',
                data: dataPoints,
                borderColor: 'rgba(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderWidth: 2,
                tension: 0.1,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: false,
                    suggestedMin: 145,
                    suggestedMax: 160,
                    title: {
                        display: true,
                        text: 'Weight (lbs)'
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: 'Date Range'
                    }
                }
            }
        },
        plugins: [limitLinesPlugin]
    });
}

function saveWeightEntry(){
    const val = document.getElementById("weightInput").value.trim();
    if(!val || isNaN(val)){
        alert("Please enter a valid weight value.");
        return;
    }

    const today = getToday();
    
    // Check if today already exists in history, update or push
    const existingIndex = weightHistory.findIndex(item => item.date === today);
    if(existingIndex >= 0){
        weightHistory[existingIndex].weight = parseFloat(val);
    } else {
        weightHistory.push({
            date: today,
            weight: parseFloat(val)
        });
    }

    renderChart();
    document.getElementById("weightInput").value = "";
    alert("Weight added to current view queue. Click 'Save Weight Log to GitHub' to persist.");
}

/*
====================================================
DATE FORMAT
====================================================
*/

function getToday(){
    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:"America/Vancouver",
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    ).format(new Date());
}

function loadGitHubToken(){
    const savedToken = localStorage.getItem("githubToken");
    const remember = localStorage.getItem("rememberToken");

    if(savedToken && remember === "true"){
        document.getElementById("githubToken").value = savedToken;
        document.getElementById("rememberToken").checked = true;
    }
}

/*
====================================================
SAVE WEIGHT LOG TO GITHUB
====================================================
*/

async function saveWeightLog(){
    const token = document.getElementById("githubToken").value.trim();

    if(document.getElementById("rememberToken").checked){
        localStorage.setItem("githubToken", token);
        localStorage.setItem("rememberToken", "true");
    }

    if(!token){
        alert("Enter a GitHub PAT before saving.");
        return;
    }

    if(weightHistory.length === 0){
        alert("No weight data available to save.");
        return;
    }

    try{
        const getResponse = await fetch(
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${WEIGHT_LOG_FILE}`,
            {
                headers:{
                    Authorization: `Bearer ${token}`,
                    Accept: "application/vnd.github+json"
                }
            }
        );

        if(!getResponse.ok){
            throw new Error("Unable to read weight-log.csv");
        }

        const existingFile = await getResponse.json();

        // Build complete CSV content from weightHistory array
        let csvContent = "Date,Weight\n";
        weightHistory.forEach(item => {
            csvContent += `"${item.date}",${item.weight}\n`;
        });

        const encodedContent = btoa(
            unescape(
                encodeURIComponent(csvContent)
            )
        );

        const putResponse = await fetch(
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${WEIGHT_LOG_FILE}`,
            {
                method: "PUT",
                headers:{
                    Authorization: `Bearer ${token}`,
                    Accept: "application/vnd.github+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Weight Log update ${getToday()}`,
                    content: encodedContent,
                    sha: existingFile.sha,
                    branch: GITHUB_BRANCH
                })
            }
        );

        if(!putResponse.ok){
            const error = await putResponse.json();
            throw new Error(error.message || "GitHub save failed");
        }

        alert("Weight log saved successfully to GitHub.");

        if(!document.getElementById("rememberToken").checked){
            document.getElementById("githubToken").value = "";
        }

    }
    catch(error){
        console.error(error);
        alert("Error saving weight log:\n\n" + error.message);
    }
}

/*
====================================================
EVENT LISTENERS
====================================================
*/

document.getElementById("rememberToken").addEventListener("change", function(){
    if(this.checked){
        const token = document.getElementById("githubToken").value.trim();
        if(token){
            localStorage.setItem("githubToken", token);
        }
        localStorage.setItem("rememberToken", "true");
    }
    else{
        localStorage.removeItem("githubToken");
        localStorage.removeItem("rememberToken");
    }
});

/*
====================================================
INITIALIZE
====================================================
*/

(async function(){
    loadGitHubToken();
    await loadWeightLog();
})();

</script>

</body>

</html>
