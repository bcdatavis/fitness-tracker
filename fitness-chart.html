<!DOCTYPE html> <html lang="en">

<head>

<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="img/favicon.png" type="image/png">

<title>Fitness Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{ box-sizing:border-box; }

body{ font-family:Arial,sans-serif; max-width:800px; margin:auto; padding:12px; background:#f4f4f4; }

h1{ text-align:center; margin-bottom:20px; }

.control-card{ background:white; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; }

label{ display:block; font-weight:bold; margin-bottom:6px; }

select{ width:100%; padding:8px 10px; font-size:16px; border:1px solid #aaa; border-radius:5px; background:white; }

.status{ margin-top:12px; padding:10px; border-radius:5px; color:#555; background:#f8f8f8; font-size:14px; }

.status.success{ color:#176b2c; background:#e9f7ed; }

.status.error{ color:#a00000; background:#ffe8e8; }

.chart-container{ position:relative; height:400px; width:100%; margin-top:25px; background:white; padding:15px; border-radius:8px; border:1px solid #ccc; }

.info-card{ background:white; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; font-size:14px; color:#555; }

</style>

</head>

<body>

<h1> Fitness Tracker </h1>

<div class="control-card">

<label for="fieldSelect"> Select Data to Graph </label>

<select id="fieldSelect" disabled>

<option value=""> Loading... </option>

</select>

<div id="statusMessage" class="status"

Starting... </div>

</div>

<div class="chart-container">

<canvas id="fitnessChart"></canvas>

</div>

<div class="info-card">

<strong>Data source:</strong><br>

fitness-log.csv

<br><br>

Choose a field above to change the graph.

</div>

<script>

/* ==================================================== CONFIGURATION ==================================================== */

const FITNESSLOGURL = "https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/log/fitness-log.csv";

const TARGET_RANGES = {

    protein: {
        min: 120,
        max: 150
    },

    calories: {
        min: 2450,
        max: 2700
    },

    fat: {
        min: 60,
        max: 75
    },

    sugar: {
        min: 100,
        max: 120
    },

    carbs: {
        min: 300,
        max: 350
    }

};


const targetRangePlugin = {

    id: "targetRange",

    beforeDraw(chart) {

        const field =
            chart.config.options.targetField;

        const range =
            TARGET_RANGES[field];

        /*
        No target range for this field.
        */

        if(!range){
            return;
        }


        const {
            ctx,
            chartArea,
            scales
        } = chart;


        const y =
            scales.y;


        const top =
            y.getPixelForValue(
                range.max
            );


        const bottom =
            y.getPixelForValue(
                range.min
            );


        ctx.save();


        /*
        Green target area.
        */

        ctx.fillStyle =
            "rgba(76, 175, 80, 0.18)";


        ctx.fillRect(

            chartArea.left,

            top,

            chartArea.right -
                chartArea.left,

            bottom - top

        );


        /*
        Top target boundary.
        */

        ctx.strokeStyle =
            "rgba(76, 175, 80, 0.8)";

        ctx.lineWidth = 2;

        ctx.setLineDash([6,6]);


        ctx.beginPath();

        ctx.moveTo(
            chartArea.left,
            top
        );

        ctx.lineTo(
            chartArea.right,
            top
        );

        ctx.stroke();


        /*
        Bottom target boundary.
        */

        ctx.beginPath();

        ctx.moveTo(
            chartArea.left,
            bottom
        );

        ctx.lineTo(
            chartArea.right,
            bottom
        );

        ctx.stroke();


        ctx.restore();

    }

};
    
/* ==================================================== GLOBALS ==================================================== */

let fitnessData = [];

let fitnessChart = null;

/* ==================================================== STATUS ==================================================== */

function setStatus( message, type = "" ){

const element = document.getElementById( "statusMessage" );

element.textContent = message;

element.className = "status " + type;

}

/* ==================================================== CSV PARSER ====================================================

This parser understands:

commas
quoted values
commas inside quoted values
blank fields
==================================================== */

function parseCSV(text){

const rows = [];

let row = [];

let value = "";

let quoted = false;

for( let i = 0; i < text.length; i++ ){

const c = text[i];

/* Quotation mark */

if(c === '"'){

/* Two quotes inside a quoted field mean one quote. */

if( quoted && text[i + 1] === '"' ){

value += '"';

i++;

} else{

quoted = !quoted;

}

continue;

}

/* Comma separates fields. */

if( c === "," && !quoted ){

row.push(value);

value = "";

continue;

}

/* Newline separates rows. */

if( (c === "\n" || c === "\r") && !quoted ){

if( c === "\r" && text[i + 1] === "\n" ){

i++;

}

row.push(value);

value = "";

if( row.some( item => item.trim() !== "" ) ){

rows.push(row);

}

row = [];

continue;

}

value += c;

}

/* Final row. */

if( value !== "" || row.length > 0 ){

row.push(value);

if( row.some( item => item.trim() !== "" ) ){

rows.push(row);

}

}

return rows;

}

/* ==================================================== FORMAT FIELD NAME ==================================================== */

function formatFieldName( field ){

return field .replace(/[_-]/g," ") .replace( /\b\w/g, character => character.toUpperCase() );

}

/* ==================================================== FORMAT DATE ==================================================== */

function formatDate( value ){

const date = new Date(value);

if( isNaN( date.getTime() ) ){

return value;

}

return new Intl.DateTimeFormat( "en-GB", { day:"2-digit", month:"2-digit", year:"numeric" } ).format(date);

}

/* ==================================================== LOAD DATA ==================================================== */

async function loadData(){

try{

/*

CONNECT

*/

setStatus( "Connecting to GitHub..." );

/*

DOWNLOAD

*/

const response = await fetch( FITNESSLOGURL, { cache:"no-store" } );

if(!response.ok){

throw new Error( "GitHub returned HTTP " + response.status );

}

/*

READ CSV

*/

setStatus( "Reading fitness log..." );

const csv = await response.text();

/*

PARSE

*/

const rows = parseCSV(csv);

if(rows.length < 2){

throw new Error( "No data rows were found." );

}

/* First row contains headers. */

const headers = rows[0].map( header => header.trim() );

/* Convert each CSV row into an object. */

fitnessData = [];

for( let i = 1; i < rows.length; i++ ){

const object = {};

headers.forEach( (header,index) => {

object[header] = rows[i][index] ?? "";

} );

fitnessData.push( object );

}

/*

FIND NUMERIC FIELDS

*/

setStatus( "Finding available fields..." );

const numericFields = [];

headers.forEach( field => {

/* Skip fields that we know are not graphable numeric fields. */

if( field === "user" || field === "date" || field === "exercise" || field === "notes" ){

return;

}

/* Find at least one number. */

for( let i = 0; i < fitnessData.length; i++ ){

const value = String( fitnessData[i][field] ).trim();

if( value !== "" && !isNaN( Number(value) ) ){

numericFields.push( field );

break;

}

}

} );

/* Make sure we found something. */

if( numericFields.length === 0 ){

throw new Error( "No numeric fields were found." );

}

/*

POPULATE DROPDOWN

*/

const select = document.getElementById( "fieldSelect" );

select.innerHTML = "";

numericFields.forEach( field => {

const option = document.createElement( "option" );

option.value = field;

option.textContent = formatFieldName( field );

select.appendChild( option );

} );

select.disabled = false;

/*

DRAW FIRST CHART

*/

renderChart( numericFields[0] );

/*

SUCCESS

*/

setStatus( fitnessData.length + " entries loaded.", "success" );

} catch(error){

console.error( "Fitness Tracker:", error );

setStatus( "Error: " + error.message, "error" );

}

}

/* ==================================================== DRAW CHART ==================================================== */

function renderChart(field){

    const canvas =
        document.getElementById("fitnessChart");

    /*
    Destroy previous chart.
    */

    if(fitnessChart){

        fitnessChart.destroy();

    }


    /*
    Create arrays.
    */

    const labels = [];
    const values = [];


    fitnessData.forEach(row => {

        const date =
            String(row.date || "").trim();


        if(date === ""){
            return;
        }


        labels.push(
            formatDate(date)
        );


        const value =
            String(row[field] || "").trim();


        if(
            value === "" ||
            isNaN(Number(value))
        ){

            values.push(null);

        }
        else{

            values.push(
                Number(value)
            );

        }

    });


    /*
    Find the actual minimum and maximum
    values in the selected field.
    */

    const validValues =
        values.filter(
            value => value !== null
        );


    let yMin = undefined;
    let yMax = undefined;


    if(validValues.length > 0){

        const dataMin =
            Math.min(...validValues);

        const dataMax =
            Math.max(...validValues);

        const range =
            dataMax - dataMin;


        /*
        Add approximately 50% of the
        data range as padding above and
        below the data.

        This makes the graph visually
        flatter and easier to read.
        */

        let padding;


        if(range === 0){

            /*
            If all values are identical,
            create a reasonable range.
            */

            padding =
                Math.max(
                    Math.abs(dataMin) * 0.10,
                    1
                );

        }
        else{

            padding =
                range * 0.50;

        }


        yMin =
            dataMin - padding;

        yMax =
            dataMax + padding;


        /*
        Don't allow a negative minimum for
        quantities that naturally cannot be
        negative.
        */

        if(dataMin >= 0){

            yMin =
                Math.max(
                    0,
                    yMin
                );

        }

    }


    /*
    Create chart.
    */

    fitnessChart =
        new Chart(
            canvas,
            {

                type:"line",

                data:{

                    labels:labels,

                    datasets:[{

                        label:
                            formatFieldName(field),

                        data:values,

                        borderColor:
                            "rgb(54,162,235)",

                        backgroundColor:
                            "rgba(54,162,235,0.15)",

                        borderWidth:2,

                        pointRadius:4,

                        pointHoverRadius:6,

                        tension:0.15,

                        fill:false,

                        spanGaps:true

                    }]

                },

                options:{

                    targetField:field,
                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{

                        mode:"index",

                        intersect:false

                    },

                    plugins:{

                        legend:{

                            display:true

                        }

                    },

                    scales:{

                        y:{

                            /*
                            Use our calculated range.
                            */

                            min:yMin,

                            max:yMax,

                            title:{

                                display:true,

                                text:
                                    formatFieldName(field)

                            }

                        },

                        x:{

                            title:{

                                display:true,

                                text:"Date"

                            }

                        }

                    }

                },

                plugins:[
                    targetRangePlugin
                ]

            }
        );

}

/* ==================================================== DROPDOWN CHANGE ==================================================== */

document .getElementById( "fieldSelect" ) .addEventListener( "change", function(){

renderChart( this.value );

} );

/* ==================================================== START ==================================================== */

loadData();

</script>

</body>

</html>
