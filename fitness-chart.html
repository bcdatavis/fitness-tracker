<!DOCTYPE html> <html lang="en">

<head>

<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="img/favicon.png" type="image/png">

<title>Fitness Tracker</title>

<!-- Chart.js --> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{ box-sizing:border-box; }

body{ font-family:Arial, sans-serif; max-width:800px; margin:auto; padding:12px; background:#f4f4f4; }

h1{ text-align:center; margin-bottom:20px; }

.control-card{ background:white; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; }

label{ display:block; font-weight:bold; margin-top:5px; margin-bottom:5px; }

select{ width:100%; padding:8px 10px; font-size:16px; border:1px solid #aaa; border-radius:5px; background:white; }

.status{ margin-top:12px; padding:10px; background:#f8f8f8; border-radius:5px; color:#555; font-size:14px; }

.error{ color:#b00020; background:#ffecec; }

.success{ color:#176b2c; background:#ecf8ef; }

.chart-container{ position:relative; height:400px; width:100%; margin-top:25px; background:white; padding:15px; border-radius:8px; border:1px solid #ccc; }

.info-card{ background:white; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; font-size:14px; color:#555; }

</style>

</head>

<body>

<h1> Fitness Tracker </h1>

<div class="control-card">

<label for="fieldSelect"> Select Data to Graph </label>

<select id="fieldSelect" disabled>

<option value=""> Loading... </option>

</select>

<div class="status" id="statusMessage"

Connecting to fitness log... </div>

</div>

<div class="chart-container">

<canvas id="fitnessChart"></canvas>

</div>

<div class="info-card">

<strong>Data source:</strong><br>

fitness-log.csv

<br><br>

Select a field above to change the graph.

</div>

<script>

/* ==================================================== CONFIGURATION ==================================================== */

/* IMPORTANT:

Use the direct RAW GitHub URL.

This is the same style of URL that you provided in your original question. */

const FITNESSLOGURL = "https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/log/fitness-log.csv";

/* ==================================================== GLOBALS ==================================================== */

let fitnessData = [];

let fitnessChartInstance = null;

/* ==================================================== STATUS ==================================================== */

function updateStatus( message, type = "" ){

const status = document.getElementById( "statusMessage" );

status.textContent = message;

status.className = "status";

if(type){

status.classList.add(type);

}

}

/* ==================================================== CSV PARSER ====================================================

This handles commas inside quoted fields.

For example:

"Thursday, July 30, 2026"

will remain one field.

==================================================== */

function parseCSV(csv){

const rows = [];

let row = [];

let value = "";

let insideQuotes = false;

for( let i = 0; i < csv.length; i++ ){

const character = csv[i];

/* Handle quotation marks. */

if(character === '"'){

/* Two quotes inside a quoted field represent one quote. */

if( insideQuotes && csv[i + 1] === '"' ){

value += '"';

i++;

} else{

insideQuotes = !insideQuotes;

}

continue;

}

/* Comma outside quotes = next field. */

if( character === "," && !insideQuotes ){

row.push(value);

value = "";

continue;

}

/* Newline outside quotes = next row. */

if( ( character === "\n" || character === "\r" ) && !insideQuotes ){

/* Handle Windows CR/LF. */

if( character === "\r" && csv[i + 1] === "\n" ){

i++;

}

row.push(value);

value = "";

/* Don't add completely empty rows. */

if( row.some( cell => cell.trim() !== "" ) ){

rows.push(row);

}

row = [];

continue;

}

value += character;

}

/* Add final field/row. */

if( value !== "" || row.length > 0 ){

row.push(value);

if( row.some( cell => cell.trim() !== "" ) ){

rows.push(row);

}

}

return rows;

}

/* ==================================================== CLEAN VALUE ==================================================== */

function cleanValue(value){

if( value === null || value === undefined ){

return "";

}

return String(value) .trim();

}

/* ==================================================== FORMAT FIELD NAME ==================================================== */

function formatFieldName(field){

return field .replace(/[_-]+/g, " ") .replace( /\b\w/g, character => character.toUpperCase() );

}

/* ==================================================== FORMAT DATE ==================================================== */

function formatDate(dateString){

const date = new Date(dateString);

if( isNaN( date.getTime() ) ){

return dateString;

}

return new Intl.DateTimeFormat( "en-GB", { day:"2-digit", month:"2-digit", year:"numeric" } ).format(date);

}

/* ==================================================== LOAD FITNESS LOG ==================================================== */

async function loadFitnessLog(){

const startTime = performance.now();

try{

/*

STEP 1

*/

updateStatus( "Connecting to GitHub..." );

/* Create a timeout.

If GitHub doesn't respond within 10 seconds, we'll report it. */

const controller = new AbortController();

const timeout = setTimeout( () => controller.abort(), 10000 );

/*

STEP 2

*/

updateStatus( "Downloading fitness log..." );

const response = await fetch( FITNESSLOGURL + "?t=" + Date.now(), { signal: controller.signal,

cache:"no-store" } );

clearTimeout(timeout);

/* Check HTTP status. */

if(!response.ok){

throw new Error( "GitHub returned HTTP " + response.status );

}

/*

STEP 3

*/

updateStatus( "Reading fitness log..." );

const csvText = await response.text();

if(!csvText){

throw new Error( "The CSV file was empty." );

}

/*

STEP 4

*/

const rows = parseCSV(csvText);

if(rows.length < 2){

throw new Error( "The CSV does not contain any data rows." );

}

/* First row = column headers. */

const headers = rows[0].map( header => cleanValue(header) );

/* Convert rows into objects. */

fitnessData = [];

for( let i = 1; i < rows.length; i++ ){

const row = {};

headers.forEach( (header, index) => {

row[header] = cleanValue( rows[i][index] );

} );

fitnessData.push(row);

}

/*

STEP 5

Find numeric fields.

*/

updateStatus( "Finding available fields..." );

const numericFields = [];

headers.forEach( field => {

/* These are text/date fields. */

if( field === "user" || field === "date" || field === "exercise" || field === "notes" ){

return;

}

/* Look for at least one numeric value.

*/

const hasNumber = fitnessData.some( row => {

const value = cleanValue( row[field] );

return ( value !== "" && isFinite( Number(value) ) );

} );

if(hasNumber){

numericFields.push( field );

}

} );

if( numericFields.length === 0 ){

throw new Error( "No numeric fields were found." );

}

/*

STEP 6

Populate dropdown. */

populateFieldSelector( numericFields );

/* Enable dropdown. */

const select = document.getElementById( "fieldSelect" );

select.disabled = false;

/* Select first field. */

select.value = numericFields[0];

/*

STEP 7

*/

renderChart( numericFields[0] );

/*

DONE

*/

const elapsed = Math.round( performance.now() - startTime );

updateStatus( ${fitnessData.length} entries loaded in ${elapsed} ms., "success" );

} catch(error){

console.error( "Fitness Tracker error:", error );

if( error.name === "AbortError" ){

updateStatus( "Timed out while connecting to GitHub. The CSV could not be downloaded within 10 seconds.", "error" );

} else{

updateStatus( "Error: " + error.message, "error" );

}

}

}

/* ==================================================== POPULATE FIELD SELECTOR ==================================================== */

function populateFieldSelector( fields ){

const select = document.getElementById( "fieldSelect" );

select.innerHTML = "";

fields.forEach( field => {

const option = document.createElement( "option" );

option.value = field;

option.textContent = formatFieldName( field );

select.appendChild( option );

} );

}

/* ==================================================== RENDER CHART ==================================================== */

function renderChart( selectedField ){

const canvas = document.getElementById( "fitnessChart" );

const ctx = canvas.getContext( "2d" );

/* Destroy previous chart. */

if( fitnessChartInstance ){

fitnessChartInstance.destroy();

}

const labels = [];

const dataPoints = [];

/* Build chart data. */

fitnessData.forEach( row => {

const dateValue = cleanValue( row.date );

if( dateValue === "" ){

return;

}

const fieldValue = cleanValue( row[selectedField] );

labels.push( formatDate( dateValue ) );

if( fieldValue === "" || !isFinite( Number(fieldValue) ) ){

dataPoints.push( null );

} else{

dataPoints.push( Number(fieldValue) );

}

} );

/* Create chart. */

fitnessChartInstance = new Chart( ctx, {

type:"line",

data:{

labels:labels,

datasets:[{

label: formatFieldName( selectedField ),

data: dataPoints,

borderColor: "rgba(54, 162, 235, 1)",

backgroundColor: "rgba(54, 162, 235, 0.15)",

borderWidth:2,

pointRadius:4,

pointHoverRadius:6,

tension:0.15,

fill:false,

spanGaps:false

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

interaction:{

mode:"index",

intersect:false

},

plugins:{

legend:{

display:true

},

tooltip:{

callbacks:{

label: function(context){

return ( " " + formatFieldName( selectedField ) + ": " + context.parsed.y );

}

}

}

},

scales:{

y:{

beginAtZero:false,

title:{

display:true,

text: formatFieldName( selectedField )

}

},

x:{

title:{

display:true,

text:"Date"

}

}

}

}

} );

}

/* ==================================================== DROPDOWN EVENT ==================================================== */

document .getElementById( "fieldSelect" ) .addEventListener( "change", function(){

if(this.value){

renderChart( this.value );

}

} );

/* ==================================================== START ==================================================== */

loadFitnessLog();

</script>

</body>

</html>
