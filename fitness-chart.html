<!DOCTYPE html> <html lang="en">

<head>

<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link rel="icon" href="img/favicon.png" type="image/png">

<title>Fitness Tracker</title>

<!-- Chart.js --> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PapaParse for CSV parsing --> <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>

*{ box-sizing:border-box; }

body{ font-family:Arial, sans-serif; max-width:800px; margin:auto; padding:12px; background:#f4f4f4; }

h1{ text-align:center; margin-bottom:20px; }

.control-card{ background:white; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; }

label{ display:block; font-weight:bold; margin-top:5px; margin-bottom:5px; }

select{ width:100%; padding:8px 10px; font-size:16px; border:1px solid #aaa; border-radius:5px; background:white; }

.status{ margin-top:12px; padding:10px; background:#f8f8f8; border-radius:5px; color:#555; font-size:14px; }

.error{ color:#b00020; background:#ffecec; }

.chart-container{ position:relative; height:400px; width:100%; margin-top:25px; background:white; padding:15px; border-radius:8px; border:1px solid #ccc; }

.info-card{ background:white; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; font-size:14px; color:#555; }

</style>

</head>

<body>

<h1> Fitness Tracker </h1>

<div class="control-card">

<label for="fieldSelect"> Select Data to Graph </label>

<select id="fieldSelect" disabled> <option value=""> Loading... </option> </select>

<div class="status" id="statusMessage"> Connecting to fitness log... </div>

</div>

<div class="chart-container"> <canvas id="fitnessChart"></canvas> </div>

<div class="info-card">

<strong>Data source:</strong><br>

fitness-log.csv

<br><br>

Select a field above to change the graph.

</div>

<script>

/* ==================================================== CONFIGURATION ==================================================== */

const FITNESSLOGURL = "https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/log/fitness-log.csv";

/* ==================================================== GLOBALS ==================================================== */

let fitnessData = []; let fitnessChartInstance = null;

/* ==================================================== STATUS MESSAGE ==================================================== */

function updateStatus(message, isError = false){

const status = document.getElementById("statusMessage");

status.textContent = message;

status.classList.toggle( "error", isError );

}

/* ==================================================== CLEAN CSV VALUE ==================================================== */

function cleanValue(value){

if(value === null || value === undefined){ return ""; }

return String(value) .replace(/^"|"$/g, "") .trim();

}

/* ==================================================== FORMAT FIELD NAME ==================================================== */

function formatFieldName(field){

return field .replace(/[_-]+/g, " ") .replace(/\b\w/g, char => char.toUpperCase() );

}

/* ==================================================== FORMAT DATE ==================================================== */

function formatDate(dateString){

const date = new Date(dateString);

if(isNaN(date.getTime())){ return dateString; }

return new Intl.DateTimeFormat( "en-GB", { day:"2-digit", month:"2-digit", year:"numeric" } ).format(date);

}

/* ==================================================== LOAD FITNESS LOG ==================================================== */

async function loadFitnessLog(){

const startTime = performance.now();

try{

updateStatus( "Downloading fitness log..." );

/* Fetch the CSV. */

const response = await fetch(FITNESSLOGURL);

if(!response.ok){

throw new Error( "HTTP error " + response.status );

}

updateStatus( "Reading fitness log..." );

const csvText = await response.text();

/* Parse CSV. */

const parsed = Papa.parse( csvText, { header:true, skipEmptyLines:true } );

if(parsed.errors && parsed.errors.length > 0){

console.warn( "CSV parsing warnings:", parsed.errors );

}

fitnessData = parsed.data;

if(fitnessData.length === 0){

throw new Error( "The fitness log is empty." );

}

/* Get the column names directly from the CSV header. */

const fields = parsed.meta.fields || [];

/* Identify numeric columns.

Rather than scanning every column repeatedly, we create a flag for each column and examine the rows once. */

const numericFields = [];

const fieldHasNumber = {};

fields.forEach(field => {

/* These are known non-numeric fields. */

if( field === "user" || field === "date" || field === "exercise" || field === "notes" ){

return;

}

fieldHasNumber[field] = false;

});

/* One pass through the data.

As soon as a numeric value is found in a column, that column qualifies. */

for( let rowIndex = 0; rowIndex < fitnessData.length; rowIndex++ ){

const row = fitnessData[rowIndex];

for( const field in fieldHasNumber ){

if(fieldHasNumber[field]){ continue; }

const value = cleanValue(row[field]);

if( value !== "" && isFinite(Number(value)) ){

fieldHasNumber[field] = true;

}

}

}

/* Build the final list. */

fields.forEach(field => {

if(fieldHasNumber[field]){

numericFields.push(field);

}

});

/* Populate dropdown. */

populateFieldSelector( numericFields );

/* Stop if no numeric fields exist. */

if(numericFields.length === 0){

throw new Error( "No numeric fields were found." );

}

/* Select the first field. */

const select = document.getElementById( "fieldSelect" );

select.value = numericFields[0];

select.disabled = false;

/* Draw first chart. */

renderChart( numericFields[0] );

/* Show completion time. */

const elapsed = Math.round( performance.now() - startTime );

updateStatus( ${fitnessData.length} entries loaded in ${elapsed} ms. );

} catch(error){

console.error( "Error loading fitness log:", error );

updateStatus( "Error: " + error.message, true );

}

}

/* ==================================================== POPULATE FIELD SELECTOR ==================================================== */

function populateFieldSelector(fields){

const select = document.getElementById( "fieldSelect" );

select.innerHTML = "";

fields.forEach(field => {

const option = document.createElement("option");

option.value = field;

option.textContent = formatFieldName(field);

select.appendChild(option);

});

}

/* ==================================================== RENDER CHART ==================================================== */

function renderChart(selectedField){

const canvas = document.getElementById( "fitnessChart" );

const ctx = canvas.getContext("2d");

/* Destroy existing chart. */

if(fitnessChartInstance){

fitnessChartInstance.destroy();

fitnessChartInstance = null;

}

/* Create labels and values. */

const labels = []; const dataPoints = [];

fitnessData.forEach(row => {

const dateValue = cleanValue(row.date);

if(dateValue === ""){ return; }

const fieldValue = cleanValue( row[selectedField] );

labels.push( formatDate(dateValue) );

/* Blank cells become null.

Chart.js will leave a gap instead of incorrectly plotting them as zero. */

if( fieldValue === "" || !isFinite(Number(fieldValue)) ){

dataPoints.push(null);

} else{

dataPoints.push( Number(fieldValue) );

}

});

/* Create Chart.js chart. */

fitnessChartInstance = new Chart( ctx, {

type:"line",

data:{

labels:labels,

datasets:[{

label: formatFieldName( selectedField ),

data:dataPoints,

borderColor: "rgba(54, 162, 235, 1)",

backgroundColor: "rgba(54, 162, 235, 0.15)",

borderWidth:2,

pointRadius:4,

pointHoverRadius:6,

tension:0.15,

fill:false,

spanGaps:false

}]

},

options:{

responsive:true,

maintainAspectRatio:false,

interaction:{

mode:"index",

intersect:false

},

plugins:{

legend:{

display:true

},

tooltip:{

callbacks:{

label:function(context){

return ( " " + formatFieldName( selectedField ) + ": " + context.parsed.y );

}

}

}

},

scales:{

y:{

beginAtZero:false,

title:{

display:true,

text: formatFieldName( selectedField )

}

},

x:{

title:{

display:true,

text:"Date"

}

}

}

}

} );

}

/* ==================================================== FIELD SELECTOR ==================================================== */

document .getElementById("fieldSelect") .addEventListener( "change", function(){

if(this.value){

renderChart( this.value );

}

} );

/* ==================================================== INITIALIZE ==================================================== */

loadFitnessLog();

</script>

</body>

</html>
