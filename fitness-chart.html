<!DOCTYPE html> <html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitness Log Test</title>

<style>

body{ font-family:Arial,sans-serif; max-width:700px; margin:auto; padding:20px; background:#f4f4f4; }

h1{ text-align:center; }

.box{ background:white; padding:20px; border-radius:8px; border:1px solid #ccc; margin-top:20px; }

#status{ padding:15px; background:#eee; border-radius:6px; white-space:pre-wrap; word-break:break-word; }

.success{ background:#e5f6e9 !important; color:#176b2c; }

.error{ background:#ffe5e5 !important; color:#a00000; }

pre{ white-space:pre-wrap; word-break:break-word; background:#222; color:#0f0; padding:15px; border-radius:6px; overflow:auto; }

</style>

</head>

<body>

<h1> Fitness Log Connection Test </h1>

<div class="box">

<div id="status"> Starting test... </div>

</div>

<div class="box">

<strong>CSV Preview</strong>

<pre id="preview"> Waiting... </pre>

</div>

<script>

/* ==================================================== TEST URL ==================================================== */

const URL = "https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/log/fitness-log.csv";

/* ==================================================== STATUS ==================================================== */

function status(message, type=""){

const element = document.getElementById("status");

element.textContent = message;

element.className = type;

}

/* ==================================================== TEST ==================================================== */

async function test(){

try{

status( "1. JavaScript is running.\n\n" + "2. Attempting to connect to GitHub..." );

/* Fetch GitHub file. */

const response = await fetch( URL, { cache:"no-store" } );

/* Report HTTP status. */

status( "3. GitHub responded.\n\n" + "HTTP status: " + response.status + "\n" + "Status text: " + response.statusText );

if(!response.ok){

throw new Error( "GitHub returned HTTP " + response.status );

}

/* Read response. */

const text = await response.text();

/* Show result. */

document.getElementById( "preview" ).textContent = text.substring( 0, 2000 );

status( "SUCCESS!\n\n" + "GitHub connection works.\n\n" + "Downloaded " + text.length + " characters from the CSV.", "success" );

} catch(error){

status( "FAILED\n\n" + "Error name: " + error.name + "\n\n" + "Error message: " + error.message + "\n\n" + "URL:\n" + URL, "error" );

console.error( error );

}

}

/* ==================================================== START ==================================================== */

test();

</script>

</body>

</html>
