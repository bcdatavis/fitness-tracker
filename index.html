<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:500px;
    margin:auto;
    padding:10px;
    background:#f5f5f5;
}

h2{
    text-align:center;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

select,input{
    width:100%;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    flex:1;
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.full{
    background:#4caf50;
    color:white;
}

.half{
    background:#2196f3;
    color:white;
}

.save{
    background:#ff9800;
    color:white;
    width:100%;
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    background:white;
}

th,td{
    padding:10px;
    border:1px solid #ccc;
    text-align:center;
}

.heading{
    background:#333;
    color:white;
}

.tokenBox{
    margin-top:15px;
}
</style>
</head>

<body>

<h2>Fitness Tracker</h2>

<label for="exercise">Exercise</label>
<select id="exercise"></select>

<label for="steps">Steps</label>
<input type="number" id="steps" placeholder="Enter steps">

<label for="foodSelect">Food</label>
<select id="foodSelect"></select>

<div class="button-row">
    <button class="full" onclick="addFood(1)">Full Serving</button>
    <button class="half" onclick="addFood(0.5)">Half Serving</button>
</div>

<table>
<tr>
    <th colspan="3" class="heading">Goals</th>
</tr>

<tr>
    <th>Protein</th>
    <th>Calories</th>
    <th>Fat</th>
</tr>

<tr>
    <td>120-140</td>
    <td>2600</td>
    <td>-</td>
</tr>
</table>

<table>
<tr>
    <th colspan="3" class="heading">Daily Totals</th>
</tr>

<tr>
    <th>Protein</th>
    <th>Calories</th>
    <th>Fat</th>
</tr>

<tr>
    <td id="totalProtein">0</td>
    <td id="totalCalories">0</td>
    <td id="totalFat">0</td>
</tr>
</table>

<div class="tokenBox">
    <label>GitHub Personal Access Token (optional)</label>
    <input type="password"
           id="githubToken"
           placeholder="Paste token to save to GitHub">
</div>

<button class="save" onclick="saveDay()">
Save
</button>

<script>

const FOOD_URL =
'https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/data/food.csv';

const EXERCISE_URL =
'https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/data/exercise.csv';

let foods=[];

let totals={
    protein:0,
    calories:0,
    fat:0
};

async function loadFoods(){

    const response = await fetch(FOOD_URL);
    const text = await response.text();

    let rows = text.trim().split('\n');

    rows.shift();

    const select =
        document.getElementById("foodSelect");

    for(let row of rows){

        let cols=row.split(',');

        let item={
            name:cols[0],
            protein:Number(cols[1]),
            calories:Number(cols[2]),
            fat:Number(cols[3])
        };

        foods.push(item);

        let option=document.createElement("option");
        option.value=item.name;
        option.text=item.name;
        select.appendChild(option);
    }
}

async function loadExercise(){

    const response=await fetch(EXERCISE_URL);
    const text=await response.text();

    const rows=text.trim().split('\n');

    const select=
      document.getElementById("exercise");

    rows.forEach(row=>{

        const option=
            document.createElement("option");

        option.value=row.trim();
        option.text=row.trim();

        select.appendChild(option);

    });
}

function updateTotalsDisplay(){

    document.getElementById("totalProtein")
        .innerText=totals.protein.toFixed(1);

    document.getElementById("totalCalories")
        .innerText=totals.calories.toFixed(1);

    document.getElementById("totalFat")
        .innerText=totals.fat.toFixed(1);
}

function addFood(multiplier){

    let selected =
        document.getElementById("foodSelect").value;

    let food=
        foods.find(f=>f.name===selected);

    totals.protein +=
        food.protein * multiplier;

    totals.calories +=
        food.calories * multiplier;

    totals.fat +=
        food.fat * multiplier;

    updateTotalsDisplay();
    saveLocalData();
}

function saveLocalData(){

    const state={

        exercise:
          document.getElementById("exercise").value,

        steps:
          document.getElementById("steps").value,

        totals:totals
    };

    localStorage.setItem(
        "fitnessTracker",
        JSON.stringify(state)
    );
}

function loadLocalData(){

    const saved=
      localStorage.getItem("fitnessTracker");

    if(!saved) return;

    const state=JSON.parse(saved);

    document.getElementById("steps").value =
        state.steps || "";

    totals = state.totals || totals;

    setTimeout(()=>{
        document.getElementById("exercise").value =
            state.exercise || "";
    },500);

    updateTotalsDisplay();
}

document.getElementById("steps")
.addEventListener("input",saveLocalData);

async function saveDay(){

    saveLocalData();

    const today=
      new Date().toISOString().split("T")[0];

    const csvLine=
`${today},
${document.getElementById("exercise").value},
${document.getElementById("steps").value},
${totals.protein},
${totals.calories},
${totals.fat}`;

    alert(
"Daily values saved locally.\n\n" +
"CSV Line:\n\n" + csvLine +
"\n\nNext step: use GitHub API to append to fitness-log.csv."
    );
}

(async function(){

    await loadFoods();
    await loadExercise();

    loadLocalData();

})();
</script>

</body>
</html>
