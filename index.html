<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/favicon.png" type="image/png">
<title>Fitness Tracker</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    max-width:600px;
    margin:auto;
    padding:12px;
    background:#f4f4f4;
}

.user-selector{

    position:absolute;
    top:12px;
    left:12px;
    width:120px;

}

.user-button{

    width:50px;
    padding-top:5px;
    padding-bottom:5px;
    padding-left:0;
    padding-right:0;
    font-size:14px;
    background:#333;
    color:white;
    
}

.user-menu{

    display:none;
    background:white;
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-top:4px;

}

.user-menu label{

    font-size:12px;
    margin:0 0 4px 0;

}

.user-menu select{

    width:100%;
    padding:4px;
    font-size:14px;

}

h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:10px;
    margin-bottom:5px;
}

select,
input{
    width:100%;
    padding:5px 10px;
    font-size:16px;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.custom-button-row{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.custom-btn{
    flex:none;
    width:220px;
}

.custom-meal-label{
    display:block;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
    margin-bottom:5px;
}
    
.full-btn{
    flex:1;
    background:#4CAF50;
    color:white;
}

.half-btn{
    flex:1;
    background:#2196F3;
    color:white;
}

.save-btn{
    width:100%;
    margin-top:20px;
    background:#FF9800;
    color:white;
}

.remember-token-label{

    display:flex;
    align-items:center;
    gap:8px;
    font-weight:normal;
    margin-top:8px;
    margin-bottom:0;

}

.remember-token-label input{

    width:auto;
    margin:0;

}    
    
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    background:white;
}

th,
td{
    border:1px solid #ccc;
    padding:3px 4px;
    text-align:center;
}

th{
    white-space:nowrap;
}

.heading{
    background:#333;
    color:white;
}

.summary{
    font-weight:bold;
}

.food-summary{
    margin-top:20px;
    background:white;
    padding:12px;
    border-radius:8px;
}

.food-summary-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.food-summary-item span{
    flex:1;
}

.food-delete-btn{
    background:none;
    border:none;
    color:#d32f2f;
    font-size:18px;
    font-weight:bold;
    padding:4px 8px;
}    
    
.completed{

    margin-top:20px;
    background:white;
    padding:12px;
    border-radius:8px;

}


.food-item{

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    border-bottom:1px solid #ddd;

}


.delete-food-btn{

    background:none;
    border:none;
    color:#d32f2f;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    padding:6px 10px;

}


.delete-food-btn:hover{

    color:#b71c1c;

}
    
</style>
</head>

<body>

<div class="user-selector">

<button 
    class="user-button"
    onclick="toggleUserMenu()">
    User ▾
</button>

<div 
    id="userMenu"
    class="user-menu">

<label for="userSelect">
Select User
</label>

<select id="userSelect">

<option value="Barnold">
Barnold
</option>

<option value="Sigourney">
Sigourney
</option>

</select>

</div>

</div>


<h1>Fitness Tracker</h1>

<label for="exercise">Exercise</label>
<select id="exercise"></select>

<style>
.form-row{
    display:flex;
    gap:12px;
}

.form-row > div{
    flex:1;
}
</style>

<div class="form-row">

    <div>
        <label for="steps">Steps</label>
        <input
            type="number"
            id="steps"
            placeholder="Steps"
        >
    </div>

    <div>
        <label for="bikeRide">Bike Ride</label>
        <input
            type="number"
            id="bikeRide"
            placeholder="Kilometres"
        >
    </div>

</div>

<label for="foodSelect">Food</label>
<select id="foodSelect"></select>

<div class="button-row">
    <button class="full-btn" onclick="addFood(1)">
        Full Serving
    </button>

    <button class="half-btn" onclick="addFood(0.5)">
        Half Serving
    </button>
</div>

    
<label class="custom-meal-label">Custom Meal</label>

<div class="form-row">

    <div>
        <label for="customProtein">Protein (g)</label>
        <input
            type="number"
            id="customProtein"
            placeholder="0"
            step="0.1">
    </div>

    <div>
        <label for="customCalories">Calories</label>
        <input
            type="number"
            id="customCalories"
            placeholder="0"
            step="1">
    </div>

    <div>
        <label for="customFat">Fat (g)</label>
        <input
            type="number"
            id="customFat"
            placeholder="0"
            step="0.1">
    </div>

    <div>
        <label for="customSugar">Sugar (g)</label>
        <input
            type="number"
            id="customSugar"
            placeholder="0"
            step="0.1">
    </div>

</div>

<div class="custom-button-row">
    <button
        class="full-btn custom-btn"
        onclick="addCustomMeal()">
        Add Custom Meal
    </button>
</div>

<table>
    <tr>
        <th colspan="4" class="heading">
            Goals
        </th>
    </tr>

    <tr>
        <th>Protein (g)</th>
        <th>Calories</th>
        <th>Fat (g)</th>
        <th>Sugar (g)</th>
    </tr>

    <tr>
        <td id="goalProtein">120-140</td>
        <td id="goalCalories">2600</td>
        <td id="goalFat">55-100</td>
        <td id="goalSugar">100-120</td>
    </tr>
</table>

<table>

    <tr>
        <th colspan="4" class="heading">
            Daily Totals
        </th>
    </tr>

    <tr>
        <th>Protein (g)</th>
        <th>Calories</th>
        <th>Fat (g)</th>
        <th>Sugar (g)</th>
    </tr>

    <tr class="summary">
        <td id="totalProtein">0</td>
        <td id="totalCalories">0</td>
        <td id="totalFat">0</td>
        <td id="totalSugar">0</td>
    </tr>

</table>

<div class="completed">

    <div class="heading">
        Foods Eaten Today
    </div>

    <div id="foodList">
        No foods recorded.
    </div>

</div>
    
<label for="githubToken">
    GitHub Token
</label>

<input
    type="password"
    id="githubToken"
    autocomplete="off"
    placeholder="Paste Token to Save"
/>

<label class="remember-token-label">

<input
type="checkbox"
id="rememberToken"
>

<span>Remember Token</span>

</label>
    
<button
    class="save-btn"
    onclick="saveDay()">
    Save
</button>

<script>

/*
====================================================
CONFIGURATION
====================================================
*/

const FOOD_URL =
"https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/data/food.csv";

const EXERCISE_URL =
"https://raw.githubusercontent.com/bcdatavis/fitness-tracker/main/data/exercise.csv";

const GITHUB_OWNER = "bcdatavis";
const GITHUB_REPO = "fitness-tracker";
const GITHUB_BRANCH = "main";
const LOG_FILE = "log/fitness-log.csv";

/*
====================================================
GLOBALS
====================================================
*/

let foods = [];

let eatenToday = [];

let foodHistory = [];

let selectedUser = "Barnold";
    
let totals = {
    protein:0,
    calories:0,
    fat:0,
    sugar:0
};


function toggleUserMenu(){

    const menu =
        document.getElementById("userMenu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }
    else{

        menu.style.display = "block";

    }

}    
    
/*
====================================================
LOAD FOODS
====================================================
*/

async function loadFoods(){

    try{

        const response =
            await fetch(FOOD_URL);

        const csv =
            await response.text();

        const rows =
            csv.trim().split("\n");

        rows.shift();

        const foodSelect =
            document.getElementById("foodSelect");

        const placeholder =
            document.createElement("option");

        placeholder.value = "";
        placeholder.textContent = "Select one";
        placeholder.disabled = true;
        placeholder.selected = true;

        foodSelect.appendChild(placeholder);

        rows.forEach(row => {

            const cols = row.split(",");

            const food = {
                name:cols[0],
                protein:Number(cols[1]),
                calories:Number(cols[2]),
                fat:Number(cols[3]),
                sugar: Number(cols[4])
            };

            foods.push(food);

            const option =
                document.createElement("option");

            option.value = food.name;
            option.textContent = food.name;

            foodSelect.appendChild(option);

        });

    }
    catch(error){
        console.error(error);
        alert("Unable to load food.csv");
    }

}

/*
====================================================
LOAD EXERCISES
====================================================
*/

async function loadExercises(){

    try{

        const response =
            await fetch(EXERCISE_URL);

        const csv =
            await response.text();

        const rows =
            csv.trim().split("\n");

        const exerciseSelect =
            document.getElementById("exercise");

        const placeholder =
            document.createElement("option");

        placeholder.value = "";
        placeholder.textContent = "Select one";
        placeholder.disabled = true;
        placeholder.selected = true;

        exerciseSelect.appendChild(placeholder);
        
        rows.forEach(row => {

            const value = row.trim();

            if(!value){
                return;
            }

            const option =
                document.createElement("option");

            option.value = value;
            option.textContent = value;

            exerciseSelect.appendChild(option);

        });

    }
    catch(error){

        console.error(error);

        const exerciseSelect =
            document.getElementById("exercise");

        [
            "arms",
            "legs & core",
            "bike",
            "bike & arms"
        ].forEach(item => {

            const option =
                document.createElement("option");

            option.value = item;
            option.textContent = item;

            exerciseSelect.appendChild(option);

        });

    }

}

/*
====================================================
DISPLAY TOTALS
====================================================
*/

function updateTotalsDisplay(){

    document.getElementById("totalProtein").textContent =
        totals.protein.toFixed(1);

    document.getElementById("totalCalories").textContent =
        totals.calories.toFixed(1);

    document.getElementById("totalFat").textContent =
        totals.fat.toFixed(1);

    document.getElementById("totalSugar").textContent =
        totals.sugar.toFixed(1);

}

function updateGoals(){

    const user =
        document.getElementById("userSelect").value;


    if(user === "Sigourney"){

        document.getElementById("goalProtein").textContent =
            "110-130";

        document.getElementById("goalCalories").textContent =
            "1650";

        document.getElementById("goalFat").textContent =
            "45-55";

        document.getElementById("goalSugar").textContent =
            "100";

    }
    else{

        document.getElementById("goalProtein").textContent =
            "120-140";

        document.getElementById("goalCalories").textContent =
            "2600";

        document.getElementById("goalFat").textContent =
            "55-100";

        document.getElementById("goalSugar").textContent =
            "100-120";

    }

}
    
function updateFoodList(){

    const list =
        document.getElementById("foodList");


    if(eatenToday.length === 0){

        list.textContent =
            "No foods recorded.";

        return;

    }


    list.innerHTML = "";


    eatenToday.forEach((food,index)=>{


        const div =
            document.createElement("div");


        div.className =
            "food-item";


        const text =
            document.createElement("span");


        text.textContent =
            "✓ " + food.name + " - " + food.serving;


        const remove =
            document.createElement("button");


        remove.className =
            "delete-food-btn";


        remove.textContent =
            "✕";


        remove.onclick = function(){


            // REMOVE NUTRITION FROM TOTALS
            totals.protein -= food.protein;

            totals.calories -= food.calories;

            totals.fat -= food.fat;

            totals.sugar -= food.sugar;


            // PREVENT NEGATIVE ROUNDING ERRORS
            totals.protein = Math.max(0, totals.protein);

            totals.calories = Math.max(0, totals.calories);

            totals.fat = Math.max(0, totals.fat);

            totals.sugar = Math.max(0, totals.sugar);


            // REMOVE FOOD FROM LIST
            eatenToday.splice(index,1);


            updateTotalsDisplay();

            updateFoodList();

            saveLocalState();

        };


        div.appendChild(text);

        div.appendChild(remove);


        list.appendChild(div);


    });

}
    
/*
====================================================
ADD FOOD
====================================================
*/

function addFood(servingMultiplier){

    const selectedFood =
        document.getElementById("foodSelect").value;

    if (!selectedFood) {
        alert("Please select a food.");
        return;
    }

    const food =
        foods.find(
            x => x.name === selectedFood
        );

    if(!food){
        return;
    }

    totals.protein +=
        food.protein * servingMultiplier;

    totals.calories +=
        food.calories * servingMultiplier;

    totals.fat +=
        food.fat * servingMultiplier;

    totals.sugar +=
    food.sugar * servingMultiplier;


    // STORE FOOD WITH NUTRITION DATA
    eatenToday.push({
    
        name: food.name,
    
        serving:
            servingMultiplier === 1
            ? "Full Serving"
            : "Half Serving",
    
        protein:
            food.protein * servingMultiplier,
    
        calories:
            food.calories * servingMultiplier,
    
        fat:
            food.fat * servingMultiplier,
    
        sugar:
            food.sugar * servingMultiplier
    
    });
    
    updateFoodList();
    
    
    updateTotalsDisplay();
    
    saveLocalState();

}

/*
====================================================
ADD CUSTOM MEAL
====================================================
*/

function addCustomMeal(){

    const protein =
        Number(document.getElementById("customProtein").value) || 0;

    const calories =
        Number(document.getElementById("customCalories").value) || 0;

    const fat =
        Number(document.getElementById("customFat").value) || 0;

    const sugar =
        Number(document.getElementById("customSugar").value) || 0;

    if(protein === 0 && calories === 0 && fat === 0 && sugar === 0){
        alert("Enter at least one value.");
        return;
    }

    totals.protein += protein;
    totals.calories += calories;
    totals.fat += fat;
    totals.sugar += sugar;

    eatenToday.push({

    name:"Custom Meal",

    serving:"Full Serving",

    protein:protein,

    calories:calories,

    fat:fat,

    sugar:sugar

});
    
    updateFoodList();
    updateTotalsDisplay();
    saveLocalState();

    document.getElementById("customProtein").value = "";
    document.getElementById("customCalories").value = "";
    document.getElementById("customFat").value = "";
    document.getElementById("customSugar").value = "";
}
    
    
/*
====================================================
LOCAL STORAGE
====================================================
*/

function saveLocalState(){

    const state = {

        user:
            document.getElementById("userSelect").value,
        
        exercise:
            document.getElementById("exercise").value,

        steps:
            document.getElementById("steps").value,

        bikeRide:
            document.getElementById("bikeRide").value,

        customProtein:
            document.getElementById("customProtein").value,

        customCalories:
            document.getElementById("customCalories").value,
        
        customFat:
            document.getElementById("customFat").value,

        customSugar:
            document.getElementById("customSugar").value,

        totals,

        eatenToday

    };

    localStorage.setItem(
        "fitnessTracker",
        JSON.stringify(state)
    );

}

function loadLocalState(){

    const saved =
        localStorage.getItem(
            "fitnessTracker"
        );

    if(!saved){
        return;
    }

    const state =
        JSON.parse(saved);

    document.getElementById("userSelect").value =
        state.user || "Barnold";
    
    selectedUser =
        state.user || "Barnold";
    
    document.getElementById("steps").value =
        state.steps || "";

    document.getElementById("bikeRide").value =
        state.bikeRide || "";

    document.getElementById("customProtein").value =
        state.customProtein || "";

    document.getElementById("customCalories").value =
        state.customCalories || "";
    
    document.getElementById("customFat").value =
        state.customFat || "";

    document.getElementById("customSugar").value =
        state.customSugar || "";

    totals =
        state.totals || totals;

    eatenToday =
        state.eatenToday || [];
    
    updateTotalsDisplay();

    updateFoodList();

    setTimeout(() => {

        document.getElementById("exercise").value =
            state.exercise || "";

    },500);

}

function loadGitHubToken(){

    const savedToken =
        localStorage.getItem("githubToken");

    const remember =
        localStorage.getItem("rememberToken");


    if(savedToken && remember === "true"){

        document.getElementById("githubToken").value =
            savedToken;

        document.getElementById("rememberToken").checked =
            true;

    }

}
    
/*
====================================================
CLEAR FORM AFTER SAVE
====================================================
*/

function clearDailyValues(){

    document.getElementById("steps").value = "";

    document.getElementById("bikeRide").value = "";

    if(
    !document.getElementById("rememberToken").checked
    ){
    
        document.getElementById("githubToken").value="";
    
    }

    document.getElementById("exercise").selectedIndex = 0;

    document.getElementById("foodSelect").selectedIndex = 0;

    document.getElementById("customProtein").value = "";
    
    document.getElementById("customCalories").value = "";
    
    document.getElementById("customFat").value = "";

    document.getElementById("customSugar").value = "";

    totals = {
        protein:0,
        calories:0,
        fat:0,
        sugar:0
    };

    updateTotalsDisplay();

    localStorage.removeItem("fitnessTracker");

}

/*
====================================================
SAVE TO GITHUB
====================================================
*/

async function saveDay(){

    const token =
        document.getElementById(
            "githubToken"
        ).value.trim();

    if(
    document.getElementById("rememberToken").checked
    ){
    
        localStorage.setItem(
            "githubToken",
            token
        );
    
        localStorage.setItem(
            "rememberToken",
            "true"
        );
    
    }

    if(!token){

        alert(
            "Enter a GitHub PAT before saving."
        );

        return;

    }

    try{

        const today = new Intl.DateTimeFormat("en-CA", {
            timeZone: "America/Vancouver",
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }).format(new Date());

        const line =
`${document.getElementById("userSelect").value},"${today}",${document.getElementById("exercise").value},${document.getElementById("steps").value},${document.getElementById("bikeRide").value},${totals.protein.toFixed(1)},${totals.calories.toFixed(1)},${totals.fat.toFixed(1)},${totals.sugar.toFixed(1)}
`;

        /*
        GET EXISTING FILE
        */

        const getResponse =
            await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${LOG_FILE}`,
            {
                headers:{
                    Authorization:`Bearer ${token}`,
                    Accept:"application/vnd.github+json"
                }
            });

        if(!getResponse.ok){

            throw new Error(
                "Unable to read fitness-log.csv"
            );

        }

        const existingFile =
            await getResponse.json();

        const currentContent =
            atob(
                existingFile.content
                .replace(/\n/g,"")
            );

        const updatedContent =
            currentContent + line;

        const encodedContent =
            btoa(
                unescape(
                    encodeURIComponent(
                        updatedContent
                    )
                )
            );

        /*
        COMMIT UPDATED FILE
        */

        const putResponse =
            await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${LOG_FILE}`,
            {
                method:"PUT",

                headers:{
                    Authorization:`Bearer ${token}`,
                    Accept:"application/vnd.github+json",
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    message:
                        `Fitness Log ${today}`,

                    content:
                        encodedContent,

                    sha:
                        existingFile.sha,

                    branch:
                        GITHUB_BRANCH

                })

            });

        if(!putResponse.ok){

            const error =
                await putResponse.json();

            console.error(error);

            throw new Error(
                error.message ||
                "GitHub commit failed"
            );

        }

        alert(
            "Fitness log saved successfully."
        );

        clearDailyValues();

    }
    catch(error){

        console.error(error);

        alert(
            "Error saving log:\n\n" +
            error.message
        );

    }

}

/*
====================================================
AUTO SAVE STEPS
====================================================
*/

document.addEventListener(
    "input",
    function(event){

        if(
            event.target.id === "steps" ||
            event.target.id === "bikeRide"
        ){
            saveLocalState();
        }

    }
);

document.addEventListener(
    "input",
    function(event){

        if(
            event.target.id === "steps" ||
            event.target.id === "bikeRide"
        ){
            saveLocalState();
        }

    }
);


/*
====================================================
AUTO SAVE STEPS
====================================================
*/

document.addEventListener(
    "input",
    function(event){

        if(
            event.target.id === "steps" ||
            event.target.id === "bikeRide"
        ){
            saveLocalState();
        }

    }
);


/*
====================================================
USER SELECTOR
====================================================
*/

document
.getElementById("userSelect")
.addEventListener("change", function(){

    selectedUser = this.value;

    updateGoals();

    saveLocalState();

});


document
.getElementById("rememberToken")
.addEventListener("change", function(){

    if(this.checked){

        const token =
            document.getElementById("githubToken").value.trim();

        if(token){

            localStorage.setItem(
                "githubToken",
                token
            );

        }

        localStorage.setItem(
            "rememberToken",
            "true"
        );

    }
    else{

        localStorage.removeItem(
            "githubToken"
        );

        localStorage.removeItem(
            "rememberToken"
        );

    }

});



/*
====================================================
INITIALIZE
====================================================
*/
    
/*
====================================================
INITIALIZE
====================================================
*/

(async function(){

    await loadFoods();

    await loadExercises();

    loadLocalState();

    updateGoals();

    loadGitHubToken();

})();

</script>

</body>
</html>
