<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker Progress Dashboard</title>
    <!-- Include PapaParse for reliable CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        p {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Workout Progress vs. Goals</h1>
    
    <table id="progressTable">
        <thead>
            <tr>
                <th>Category</th>
                <th>Exercise Completion</th>
                <th>Progress</th>
                <th>Adherence</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be populated dynamically via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // GitHub Raw URLs provided
    const goalsUrl = 'https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/data/workout.csv';
    const logUrl = 'https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/log/workout-log.csv';

    async function loadData() {
        try {
            const [goalsRes, logRes] = await Promise.all([
                fetch(goalsUrl),
                fetch(logUrl)
            ]);

            const goalsText = await goalsRes.text();
            const logText = await logRes.text();

            const goalsData = Papa.parse(goalsText, { header: true }).data;
            const logData = Papa.parse(logText, { header: true }).data;

            processAndRenderTable(goalsData, logData);
        } catch (error) {
            console.error('Error loading fitness data:', error);
        }
    }

    function processAndRenderTable(goals, logs) {
        const categoryStats = {};

        // 1. Map expected exercises per category from workout.csv
        goals.forEach(row => {
            if (!row.category || !row.exercise) return;
            const cat = row.category.trim().toLowerCase();
            const ex = row.exercise.trim().toLowerCase();

            if (!categoryStats[cat]) {
                categoryStats[cat] = {
                    displayName: row.category.trim(),
                    uniqueExercises: new Set(),
                    completedExercises: new Set(),
                    totalSessionsLogged: 0,
                    activeSessionsCount: 0
                };
            }
            categoryStats[cat].uniqueExercises.add(ex);
        });

        // 2. Track logged exercises and dates from workout-log.csv
        const sessionCategoriesLogged = {}; // Track sessions per date and category

        logs.forEach(row => {
            if (!row.Category || !row.Exercise || !row.Date) return;
            const cat = row.Category.trim().toLowerCase();
            const ex = row.Exercise.trim().toLowerCase();
            const date = row.Date.replace(/"/g, '').trim();

            if (categoryStats[cat]) {
                // Check if any set was actually performed (> 0)
                let performed = false;
                ['Set-1', 'Set-2', 'Set-3'].forEach(setKey => {
                    let val = row[setKey];
                    if (val !== undefined && val !== '' && !isNaN(val) && Number(val) > 0) {
                        performed = true;
                    }
                });

                if (performed) {
                    categoryStats[cat].completedExercises.add(ex);
                    
                    // Track unique category occurrences per date for adherence calculation
                    const sessionKey = `${date}-${cat}`;
                    sessionCategoriesLogged[sessionKey] = true;
                }
            }
        });

        // Calculate adherence based on active dates logged out of estimated total session days
        // (For demonstration, adherence evaluates frequency against total logged unique training days or baseline benchmarks)
        const allUniqueDates = [...new Set(logs.map(r => r.Date ? r.Date.replace(/"/g, '').trim() : ''))].filter(Boolean);
        const totalLoggedDays = allUniqueDates.length || 1;

        const tbody = document.querySelector('#progressTable tbody');
        tbody.innerHTML = '';

        Object.keys(categoryStats).forEach(catKey => {
            const stats = categoryStats[catKey];
            const totalTarget = stats.uniqueExercises.size;
            const completedCount = stats.completedExercises.size;

            // Compute Progress percentage (Completed unique exercises / Total target exercises for that category)
            const progressPct = totalTarget > 0 ? Math.round((completedCount / totalTarget) * 100) : 0;

            // Compute simulated Adherence based on how often categories are hit relative to total tracked training days
            const categoryDaysHit = Object.keys(sessionCategoriesLogged).filter(k => k.endsWith(`-${catKey}`)).length;
            const adherencePct = Math.min(100, Math.round((categoryDaysHit / totalLoggedDays) * 100));

            // Capitalize category name for display
            const formattedCategoryName = stats.displayName.charAt(0).toUpperCase() + stats.displayName.slice(1);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${formattedCategoryName}</td>
                <td>${completedCount} / ${totalTarget}</td>
                <td>${progressPct}%</td>
                <td>${adherencePct}%</td>
            `;
            tbody.appendChild(tr);
        });
    }

    loadData();
</script>

</body>
</html>
