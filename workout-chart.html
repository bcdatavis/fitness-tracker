<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker Progress Dashboard</title>
    <!-- Include PapaParse for reliable CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        p {
            text-align: center;
            color: #666;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Completed Weekly Exercise vs. Goals (Last 7 Days)</h1>
    
    <table id="progressTable">
        <thead>
            <tr>
                <th>Category</th>
                <th>Exercise Completion</th>
                <th>Progress</th>
                <th>Adherence (Frequency Met)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be populated dynamically via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    const goalsUrl = 'https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/data/workout.csv';
    const logUrl = 'https://raw.githubusercontent.com/bcdatavis/fitness-tracker/refs/heads/main/log/workout-log.csv';

    async function loadData() {
        try {
            const [goalsRes, logRes] = await Promise.all([
                fetch(goalsUrl),
                fetch(logUrl)
            ]);

            const goalsText = await goalsRes.text();
            const logText = await logRes.text();

            const goalsData = Papa.parse(goalsText, { header: true }).data;
            const logData = Papa.parse(logText, { header: true }).data;

            processAndRenderTable(goalsData, logData);
        } catch (error) {
            console.error('Error loading fitness data:', error);
        }
    }

    function processAndRenderTable(goals, logs) {
        const categoryStats = {};

        // 1. Map expected exercises and their target weekly frequency from workout.csv
        goals.forEach(row => {
            if (!row.category || !row.exercise) return;
            const cat = row.category.trim().toLowerCase();
            const ex = row.exercise.trim().toLowerCase();
            const targetFreq = parseInt(row['Weekly-Frequency']) || 0;

            if (!categoryStats[cat]) {
                categoryStats[cat] = {
                    displayName: row.category.trim(),
                    exercises: {} // Map exercise name to its target frequency
                };
            }
            categoryStats[cat].exercises[ex] = targetFreq;
        });

        // Initialize tracking structures for the rolling 7-day window
        const today = new Date('2026-07-31T00:00:00');
        const cutoffDate = new Date(today);
        cutoffDate.setDate(today.getDate() - 7);

        // Track how many unique days *each specific exercise* was performed in the last 7 days
        const exerciseDaysHit = {};
        Object.keys(categoryStats).forEach(cat => {
            exerciseDaysHit[cat] = {};
            Object.keys(categoryStats[cat].exercises).forEach(ex => {
                exerciseDaysHit[cat][ex] = new Set();
            });
        });

        // 2. Filter and process logs within the 7-day rolling window
        logs.forEach(row => {
            if (!row.Category || !row.Exercise || !row.Date) return;
            
            const cleanDateStr = row.Date.replace(/"/g, '').trim();
            const logDate = new Date(cleanDateStr);

            if (isNaN(logDate) || logDate < cutoffDate || logDate > today) return;

            const cat = row.Category.trim().toLowerCase();
            const ex = row.Exercise.trim().toLowerCase();

            if (categoryStats[cat] && categoryStats[cat].exercises[ex] !== undefined) {
                let performed = false;
                ['Set-1', 'Set-2', 'Set-3'].forEach(setKey => {
                    let val = row[setKey];
                    if (val !== undefined && val !== '' && !isNaN(val) && Number(val) > 0) {
                        performed = true;
                    }
                });

                if (performed) {
                    exerciseDaysHit[cat][ex].add(cleanDateStr);
                }
            }
        });

        // 3. Render the table
        const tbody = document.querySelector('#progressTable tbody');
        tbody.innerHTML = '';

        Object.keys(categoryStats).forEach(catKey => {
            const stats = categoryStats[catKey];
            const exerciseMap = stats.exercises;
            const totalTargetExercises = Object.keys(exerciseMap).length;

            let completedUniqueCount = 0;
            let totalAdherencePointsEarned = 0;
            let totalAdherencePointsPossible = 0;

            Object.keys(exerciseMap).forEach(ex => {
                const targetFreq = exerciseMap[ex];
                const daysPerformed = exerciseDaysHit[catKey][ex].size;

                // Count as completed if performed at least once in the window
                if (daysPerformed > 0) {
                    completedUniqueCount++;
                }

                // Skip alternate exercises (Weekly-Frequency = 0) from adherence weight calculations
                if (catKey !== 'alternate' && targetFreq > 0) {
                    totalAdherencePointsPossible += targetFreq;
                    // Cap adherence credit at the target frequency per exercise
                    totalAdherencePointsEarned += Math.min(targetFreq, daysPerformed);
                }
            });

            // Progress percentage (Unique exercises touched vs total unique exercises in category)
            const progressPct = totalTargetExercises > 0 ? Math.round((completedUniqueCount / totalTargetExercises) * 100) : 0;

            // Adherence calculation
            let adherenceDisplay = '';
            if (catKey === 'alternate') {
                adherenceDisplay = `${completedUniqueCount} logged (N/A)`;
            } else {
                const adherencePct = totalAdherencePointsPossible > 0 
                    ? Math.round((totalAdherencePointsEarned / totalAdherencePointsPossible) * 100) 
                    : 0;
                adherenceDisplay = `${totalAdherencePointsEarned} / ${totalAdherencePointsPossible} sessions (${adherencePct}%)`;
            }

            const formattedCategoryName = stats.displayName.charAt(0).toUpperCase() + stats.displayName.slice(1);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${formattedCategoryName}</td>
                <td>${completedUniqueCount} / ${totalTargetExercises}</td>
                <td>${progressPct}%</td>
                <td>${adherenceDisplay}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    loadData();
</script>

</body>
</html>
